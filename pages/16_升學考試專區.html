<style type="text/css">
.cdc{font-family:微軟正黑體,"Microsoft JhengHei",Arial,sans-serif;max-width:860px;margin:0 auto;color:#333;}
.cdc *{box-sizing:border-box;}
.cdc-m{margin:0 0 22px;}
.cdc-el{margin:0 0 18px;}
.cdc-el:last-child{margin-bottom:0;}
.cdc-hl{display:inline;font-weight:bold;color:#1a5f5a;}
.cdc-mark{display:inline;color:#59c0d4;font-weight:bold;border-bottom:2px solid #f5e124;padding-bottom:1px;}
.cdc-btn-sm{display:inline-block;color:#1ab3a4 !important;border:1.5px solid #1ab3a4;border-radius:20px;padding:3px 14px;margin:2px 4px;background:#fff;text-decoration:none !important;font-size:14px;font-weight:bold;line-height:1.6;transition:background .2s,color .2s;}
.cdc-btn-sm:hover{background:#1ab3a4;color:#fff !important;}
.cdc-grid{display:flex;flex-wrap:wrap;margin:-6px -6px 16px;}
.cdc-gcol{width:33.333%;padding:6px;display:flex;}
.cdc-grid.c2 .cdc-gcol{width:50%;}
.cdc-grid.c4 .cdc-gcol{width:25%;}
.cdc-gc{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#a8e6e1,#6dd5ce) border-box;border:2.5px solid transparent;border-radius:14px;overflow:hidden;text-decoration:none !important;color:#1a5f5a !important;box-shadow:0 2px 12px rgba(168,230,225,0.2);transition:transform .25s ease,box-shadow .25s ease;}
.cdc-gc:hover{transform:translateY(-6px);box-shadow:0 12px 30px rgba(109,213,206,0.32);background:linear-gradient(#f5fdfc,#f5fdfc) padding-box,linear-gradient(135deg,#59c0d4,#6dd5ce) border-box;}
.cdc-gc.text{min-height:120px;padding:40px 20px;text-align:center;font-size:1.2rem;font-weight:bold;line-height:1.7;letter-spacing:.05em;}
.cdc-gc.logo{padding-bottom:12px;}
.cdc-gc.logo img{width:100%;height:100px;object-fit:contain;padding:14px 14px 6px;display:block;}
.cdc-gc.image img{width:100%;height:auto;display:block;}
.cdc-gc-lb{font-size:14px;font-weight:bold;text-align:center;padding:0 10px;line-height:1.5;}
@media (max-width:600px){
  .cdc-grid .cdc-gcol{width:50%;}
  .cdc-grid.c2 .cdc-gcol{width:100%;}
  .cdc-gc.text{min-height:90px;padding:26px 14px;font-size:1.05rem;}
}
</style>
