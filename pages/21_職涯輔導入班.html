<style type="text/css">
.cdc{font-family:微軟正黑體,"Microsoft JhengHei",Arial,sans-serif;max-width:860px;margin:0 auto;color:#333;}
.cdc *{box-sizing:border-box;}
.cdc-m{margin:0 0 22px;}
.cdc-el{margin:0 0 18px;}
.cdc-el:last-child{margin-bottom:0;}
.cdc-hl{display:inline;font-weight:bold;color:#1a5f5a;}
.cdc-mark{display:inline;color:#59c0d4;font-weight:bold;border-bottom:2px solid #f5e124;padding-bottom:1px;}
.cdc-btn-sm{display:inline-block;color:#1ab3a4 !important;border:1.5px solid #1ab3a4;border-radius:20px;padding:3px 14px;margin:2px 4px;background:#fff;text-decoration:none !important;font-size:14px;font-weight:bold;line-height:1.6;transition:background .2s,color .2s;}
.cdc-btn-sm:hover{background:#1ab3a4;color:#fff !important;}
.cdc-hd{background:linear-gradient(to right,#a8e6e1,#6dd5ce) !important;border-radius:10px 10px 0 0;padding:13px 24px;}
.cdc-hd h2{color:#1a5f5a !important;font-size:18px;font-weight:bold;margin:0;letter-spacing:.04em;line-height:1.5;}
.cdc-hd.lg{padding:18px 32px;}
.cdc-hd.lg h2{font-size:24px;letter-spacing:.05em;}
.cdc-hdimg img{width:100%;height:auto;display:block;border-radius:10px 10px 0 0;}
.cdc-bd{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#a8e6e1,#6dd5ce) border-box;border:2.5px solid transparent;border-top:none;border-radius:0 0 14px 14px;padding:24px 30px;}
.cdc-bd.solo{border-top:2.5px solid transparent;border-radius:14px;}
.cdc-p{font-size:16px;line-height:2;color:#333;margin:0 0 18px;}
.cdc-p.sm{font-size:15px;line-height:1.9;}
.cdc-p.lg{font-size:17px;}
.cdc-p:last-child{margin-bottom:0;}
.cdc-info-row{display:flex;align-items:flex-start;padding:14px 0;border-bottom:1px solid #e0f7f5;}
.cdc-info-row:first-child{padding-top:0;}
.cdc-info-row:last-child{border-bottom:none;padding-bottom:0;}
.cdc-info-lb{font-size:15px;font-weight:bold;color:#fff;background:#59c0d4;border-radius:20px;padding:4px 16px;white-space:nowrap;margin-right:18px;flex-shrink:0;margin-top:2px;line-height:1.6;}
.cdc-info-ct{font-size:16px;color:#333;line-height:1.8;flex:1;min-width:0;word-break:break-word;}
.cdc-info-ct a:not(.cdc-btn-sm){color:#1ab3a4 !important;text-decoration:none !important;border-bottom:1.5px solid #a8e6e1;}
.cdc-notes{list-style:none;padding:0;margin:4px 0 0;font-size:15px;color:#444;line-height:2;}
.cdc-notes li::before{content:"✦";color:#59c0d4;margin-right:8px;font-size:12px;}
.cdc-img{width:100%;height:auto;border-radius:10px;display:block;margin-bottom:14px;box-shadow:0 2px 12px rgba(89,192,212,0.15);}
.cdc-img:last-child{margin-bottom:0;}
.cdc-banner img{width:100%;height:auto;border-radius:10px;display:block;}
@media (max-width:600px){
  .cdc-bd{padding:18px 16px;}
  .cdc-hd{padding:12px 16px;}
  .cdc-hd.lg{padding:14px 18px;}
  .cdc-hd.lg h2{font-size:20px;}
  .cdc-info-row{flex-direction:column;}
  .cdc-info-lb{margin:0 0 8px;}
}
</style>
<div class="cdc">
  <div class="cdc-m cdc-banner"><img alt="職涯輔導入班" src="/var/file/4/1004/img/217/438142292.png" /></div>
  <div class="cdc-m cdc-card">
    <div class="cdc-hd">
      <h2>簡介</h2>
    </div>
    <div class="cdc-bd">
      <div class="cdc-el cdc-info">
        <div class="cdc-info-row">
          <span class="cdc-info-lb">活動目的</span>
          <div class="cdc-info-ct">
            <div>鼓勵系所申請職涯輔導入班活動，協助學生職涯規劃與發展</div>
          </div>
        </div>
        <div class="cdc-info-row">
          <span class="cdc-info-lb">申請時間</span>
          <div class="cdc-info-ct">
            <div>115年4月 ～ 6月</div>
          </div>
        </div>
        <div class="cdc-info-row">
          <span class="cdc-info-lb">申請方式</span>
          <div class="cdc-info-ct">
            <div>填寫線上表單提出申請 <a href="https://forms.gle/yXNP86BgoYL1XKGE7" target="_blank" class="cdc-btn-sm">活動申請表</a></div>
          </div>
        </div>
        <div class="cdc-info-row">
          <span class="cdc-info-lb">注意事項</span>
          <div class="cdc-info-ct">
            <ul class="cdc-notes">
              <li>經費由職涯發展中心支應</li>
              <li>名額有限，每系至多 2 案</li>
              <li>依申請時間排序，如經費提前用罄，將截止受理申請</li>
              <li>活動申請案件以職涯導師為主</li>
              <li>活動結束後，請參與學生填寫 <a href="https://forms.gle/maXdZxW5uDk1yn5i8" target="_blank" class="cdc-btn-sm">回饋表</a></li>
            </ul>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cdc-m cdc-card">
    <div class="cdc-hd">
      <h2>成果</h2>
    </div>
    <div class="cdc-bd">
      <p class="cdc-el cdc-p">為讓同學們提前做好職涯準備，了解自我的優勢及如何展現個人特質，職涯發展中心規劃不同種類的職涯輔導入班活動，並針對不同的班級作個別適性的輔導，期透過個別化的輔導措施，將更貼近學生的需求。</p>
      <div class="cdc-el cdc-imgs"><img class="cdc-img" alt="" src="/var/file/4/1004/img/226/120974924.jpg" /><img class="cdc-img" alt="" src="/var/file/4/1004/img/226/203379329.jpg" /><img class="cdc-img" alt="" src="/var/file/4/1004/img/226/137941035.jpg" /></div>
    </div>
  </div>
