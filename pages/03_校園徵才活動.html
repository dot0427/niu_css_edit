<style type="text/css">
.cdc{font-family:微軟正黑體,"Microsoft JhengHei",Arial,sans-serif;max-width:860px;margin:0 auto;color:#333;}
.cdc *{box-sizing:border-box;}
.cdc-m{margin:0 0 22px;}
.cdc-el{margin:0 0 18px;}
.cdc-el:last-child{margin-bottom:0;}
.cdc-hl{display:inline;font-weight:bold;color:#1a5f5a;}
.cdc-mark{display:inline;color:#59c0d4;font-weight:bold;border-bottom:2px solid #f5e124;padding-bottom:1px;}
.cdc-btn-sm{display:inline-block;color:#1ab3a4 !important;border:1.5px solid #1ab3a4;border-radius:20px;padding:3px 14px;margin:2px 4px;background:#fff;text-decoration:none !important;font-size:14px;font-weight:bold;line-height:1.6;transition:background .2s,color .2s;}
.cdc-btn-sm:hover{background:#1ab3a4;color:#fff !important;}
.cdc-hd{background:linear-gradient(to right,#a8e6e1,#6dd5ce) !important;border-radius:10px 10px 0 0;padding:13px 24px;}
.cdc-hd h2{color:#1a5f5a !important;font-size:18px;font-weight:bold;margin:0;letter-spacing:.04em;line-height:1.5;}
.cdc-hd.lg{padding:18px 32px;}
.cdc-hd.lg h2{font-size:24px;letter-spacing:.05em;}
.cdc-hdimg img{width:100%;height:auto;display:block;border-radius:10px 10px 0 0;}
.cdc-bd{background:linear-gradient(#fff,#fff) padding-box,linear-gradient(135deg,#a8e6e1,#6dd5ce) border-box;border:2.5px solid transparent;border-top:none;border-radius:0 0 14px 14px;padding:24px 30px;}
.cdc-bd.solo{border-top:2.5px solid transparent;border-radius:14px;}
.cdc-p{font-size:16px;line-height:2;color:#333;margin:0 0 18px;}
.cdc-p.sm{font-size:15px;line-height:1.9;}
.cdc-p.lg{font-size:17px;}
.cdc-p:last-child{margin-bottom:0;}
.cdc-lead{font-size:20px;color:#1a5f5a;font-weight:bold;line-height:1.6;}
.cdc-cta{display:flex;align-items:center;flex-wrap:wrap;gap:16px;}
.cdc-cta.dv{margin-top:28px;padding-top:24px;border-top:1.5px solid #e0f7f5;}
.cdc-cta-tx{font-size:22px;font-weight:bold;color:#1a5f5a;}
.cdc-btn{display:inline-block;text-decoration:none !important;transition:all .2s;}
.cdc-btn.solid{color:#1a5f5a !important;background:linear-gradient(to right,#a8e6e1,#6dd5ce) !important;border-radius:24px;padding:10px 28px;font-size:17px;font-weight:bold;letter-spacing:.05em;box-shadow:0 3px 12px rgba(89,192,212,0.3);}
.cdc-btn.solid:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(89,192,212,0.45);}
.cdc-btn.outline{color:#1ab3a4 !important;border:1.5px solid #1ab3a4;border-radius:20px;padding:6px 20px;background:#fff;font-size:15px;font-weight:bold;}
.cdc-btn.outline:hover{background:#1ab3a4;color:#fff !important;}
@media (max-width:600px){
  .cdc-bd{padding:18px 16px;}
  .cdc-hd{padding:12px 16px;}
  .cdc-hd.lg{padding:14px 18px;}
  .cdc-hd.lg h2{font-size:20px;}
  .cdc-cta-tx{font-size:19px;}
}
</style>

    <div class="cdc-bd">
      <div class="cdc-el cdc-lead">尊敬的企業主　您好</div>
      <p class="cdc-el cdc-p lg">宜蘭大學長期以來與不同規模的企業緊密合作，</p>
      <p class="cdc-el cdc-p lg">為了讓更多企業有機會受益於本校優秀人才，並與學生攜手實踐企業與自身目標。</p>
      <p class="cdc-el cdc-p lg">我們將於 <span class="cdc-mark">115年03月25日（星期三）</span>，辦理「2026校園徵才博覽會」。</p>
